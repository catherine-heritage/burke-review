<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore the final refinements to the Burke Group logo.">
  <title>Round 3 — Burke Group Identity Review</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="round-3/round-3.css?v=colour-treatment">
  <link rel="stylesheet" href="round-navigation.css">
  <script type="module" src="round-3/round-3.js?v=colour-treatment"></script>
</head>
<body class="round-three">
<a class="skip" href="#main">Skip to review</a>
<header class="review-masthead"><a class="review-wordmark" href="./"><img src="assets/logos/blue/2/horizontal.svg" width="180" height="51" alt="Burke Group"></a><nav class="round-nav" aria-label="Review rounds"><a href="round-1/">Round 1</a><a href="round-2/">Round 2</a><a href="./" aria-current="page">Round 3</a></nav></header>
<main id="main" tabindex="-1">
  <div class="round-heading"><h1>Round 3</h1><p>Review the latest logo concepts for Burke Group and its companies.</p></div>
  <section class="logo-family" aria-label="Burke Group and subsidiary logo previews">
    <figure id="preview" class="logo-stage group-stage" aria-label="Burke Group"><span class="muted">Loading logos…</span></figure>
    <div class="subsidiary-grid">
      <figure id="preview-realty" class="logo-stage subsidiary-stage" aria-label="Burke Realty"></figure>
      <figure id="preview-development" class="logo-stage subsidiary-stage" aria-label="Burke Development"></figure>
      <figure id="preview-management" class="logo-stage subsidiary-stage" aria-label="Burke Property Management"></figure>
    </div>
  </section>
  <form id="options" class="logo-options" aria-label="Logo settings">
    <div class="options-intro"><h2>Options</h2><p>Adjust the logo styling to compare variations.</p></div>
    <fieldset class="refinement spacing"><legend>Icon spacing</legend><div class="segments"><label><input type="radio" name="spacing" value="0" checked><span>Original</span></label><label><input type="radio" name="spacing" value="1"><span>Wider</span></label></div></fieldset>
    <fieldset class="refinement shape"><legend>Icon shape</legend><div class="segments"><label><input type="radio" name="shape" value="0" checked><span>Original</span></label><label><input type="radio" name="shape" value="1"><span>Curved</span></label></div></fieldset>
    <fieldset class="refinement weight"><legend>Group weight</legend><div class="segments"><label><input type="radio" name="weight" value="0" checked><span>Original</span></label><label><input type="radio" name="weight" value="1"><span>Bold</span></label></div></fieldset>
    <fieldset class="refinement tracking"><legend>Letter spacing</legend><div class="segments"><label><input type="radio" name="tracking" value="0" checked><span>Original</span></label><label><input type="radio" name="tracking" value="1"><span>Tighter</span></label></div></fieldset>
    <fieldset class="refinement colour"><legend>Colour treatment</legend><div class="segments"><label><input type="radio" name="colour" value="0" checked><span>Original</span></label><label><input type="radio" name="colour" value="2"><span>Single-colour icon</span></label><label><input type="radio" name="colour" value="1"><span>Single-colour text</span></label></div></fieldset>
  </form>
  <p id="preview-status" class="sr-only" role="status" aria-live="polite"></p>
</main>
<noscript><p>Please enable JavaScript to explore the logo refinements.</p></noscript>
</body>
</html>
